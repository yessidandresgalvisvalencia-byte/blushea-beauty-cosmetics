<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Descubre tu producto favorito en Blushéa Beauty Cosmetics."
  >

  <title>
    Producto | Blushéa Beauty Cosmetics
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="topbar">

    <div class="brand">

      <h1>BLUSHÉA</h1>

      <span>
        Beauty Cosmetics
      </span>

    </div>


    <nav class="nav">

      <a href="/">
        Inicio
      </a>

      <a href="/#productos">
        Productos
      </a>

      <a
        href="/carrito.html"
        class="cart-link"
      >
        Carrito
      </a>

    </nav>

  </header>



  <!-- =====================================================
       DETALLE DEL PRODUCTO
       ===================================================== -->

  <main
    class="product-detail-page"
    id="detalleProducto"
  >

    <section
      class="empty-state detail-empty"
    >

      <h3>
        Cargando producto...
      </h3>

      <p>
        Estamos preparando todos los detalles.
      </p>

    </section>

  </main>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    "use strict";


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escaparHTML(valor) {

      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function formatearPrecio(valor) {

      const numero =
        Number(valor);


      if (!Number.isFinite(numero)) {

        return "$0 COP";

      }


      return `$${numero.toLocaleString("es-CO")} COP`;

    }


    function obtenerCarrito() {

      try {

        const carrito =
          JSON.parse(
            localStorage.getItem(
              "carritoBlushea"
            )
          );


        return Array.isArray(carrito)
          ? carrito
          : [];


      } catch (error) {

        console.error(
          "Error leyendo carrito:",
          error
        );


        return [];

      }

    }


    function guardarCarrito(carrito) {

      localStorage.setItem(
        "carritoBlushea",
        JSON.stringify(carrito)
      );

    }



    /* =====================================================
       PARÁMETROS DE URL

       Ejemplo:

       /producto.html?id=123&variante=Negro
       ===================================================== */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const productoId =
      parametros.get("id");


    const varianteURL =
      parametros.get("variante") || "";



    /* =====================================================
       CARGAR PRODUCTO
       ===================================================== */

    async function cargarDetalleProducto() {

      const contenedor =
        document.getElementById(
          "detalleProducto"
        );


      if (!productoId) {

        mostrarProductoNoEncontrado(
          contenedor
        );

        return;

      }


      try {

        const respuesta =
          await fetch(
            "/api/productos",
            {
              cache: "no-store"
            }
          );


        if (!respuesta.ok) {

          throw new Error(
            "No fue posible cargar los productos"
          );

        }


        const productos =
          await respuesta.json();


        if (!Array.isArray(productos)) {

          throw new Error(
            "Respuesta de productos inválida"
          );

        }


        const producto =
          productos.find(
            productoActual =>
              String(productoActual.id) ===
              String(productoId)
          );


        if (!producto) {

          mostrarProductoNoEncontrado(
            contenedor
          );

          return;

        }


        renderizarProducto(
          contenedor,
          producto
        );


      } catch (error) {

        console.error(
          "Error cargando detalle:",
          error
        );


        contenedor.innerHTML = `

          <section
            class="empty-state detail-empty"
          >

            <h3>
              No pudimos cargar este producto
            </h3>

            <p>
              Intenta nuevamente en unos segundos.
            </p>

            <button
              type="button"
              class="btn-primary"
              id="reintentarProducto"
            >
              Intentar nuevamente
            </button>

          </section>

        `;


        document
          .getElementById(
            "reintentarProducto"
          )
          ?.addEventListener(
            "click",
            cargarDetalleProducto
          );

      }

    }



    /* =====================================================
       PRODUCTO NO ENCONTRADO
       ===================================================== */

    function mostrarProductoNoEncontrado(
      contenedor
    ) {

      contenedor.innerHTML = `

        <section
          class="empty-state detail-empty"
        >

          <h3>
            Producto no encontrado
          </h3>

          <p>
            Este producto puede haber sido retirado
            o el enlace ya no está disponible.
          </p>

          <a
            href="/#productos"
            class="btn-primary"
          >
            Volver al catálogo
          </a>

        </section>

      `;

    }



    /* =====================================================
       NORMALIZAR VARIANTES
       ===================================================== */

    function obtenerVariantes(producto) {


      /* ---------------------------------------------------
         NUEVO SISTEMA
         --------------------------------------------------- */

      if (
        Array.isArray(producto.variantes) &&
        producto.variantes.length > 0
      ) {

        return producto.variantes
          .filter(
            variante =>
              variante &&
              variante.nombre
          )
          .map(
            variante => ({

              nombre:
                String(
                  variante.nombre
                ).trim(),

              imagen:
                String(
                  variante.imagen ||
                  producto.imagen ||
                  ""
                )

            })
          );

      }


      /* ---------------------------------------------------
         COMPATIBILIDAD CON PRODUCTOS ANTIGUOS
         --------------------------------------------------- */

      if (
        producto.tieneTonos &&
        Array.isArray(producto.tonos)
      ) {

        return producto.tonos
          .filter(Boolean)
          .map(
            tono => ({

              nombre:
                String(tono).trim(),

              imagen:
                String(
                  producto.imagen ||
                  ""
                )

            })
          );

      }


      return [];

    }



    /* =====================================================
       BUSCAR VARIANTE QUE VIENE DEL CATÁLOGO
       ===================================================== */

    function buscarVarianteInicial(
      variantes
    ) {

      if (!variantes.length) {

        return null;

      }


      /*
       * Si la URL contiene:
       *
       * ?variante=Negro
       *
       * buscamos Negro ignorando mayúsculas,
       * minúsculas y espacios.
       */

      if (varianteURL) {

        const nombreBuscado =
          varianteURL
            .trim()
            .toLocaleLowerCase("es");


        const encontrada =
          variantes.find(
            variante =>
              variante.nombre
                .trim()
                .toLocaleLowerCase("es") ===
              nombreBuscado
          );


        if (encontrada) {

          return encontrada;

        }

      }


      /*
       * Si entró directamente al producto sin
       * escoger color, no seleccionamos ninguno.
       */

      return null;

    }



    /* =====================================================
       RENDERIZAR PRODUCTO
       ===================================================== */

    function renderizarProducto(
      contenedor,
      producto
    ) {

      const variantes =
        obtenerVariantes(
          producto
        );


      const tieneVariantes =
        variantes.length > 0;


      const varianteInicial =
        buscarVarianteInicial(
          variantes
        );


      /*
       * Si llegó desde catálogo con Negro,
       * mostramos inmediatamente la foto negra.
       *
       * Si entró directamente sin seleccionar
       * variante, mostramos la imagen principal.
       */

      const imagenPrincipal =
        varianteInicial?.imagen ||
        producto.imagen ||
        variantes[0]?.imagen ||
        "";


      const nombre =
        escaparHTML(
          producto.nombre || "Producto"
        );


      const categoria =
        escaparHTML(
          producto.categoria || "Producto"
        );


      const descripcion =
        escaparHTML(
          producto.descripcion || ""
        );


      const stock =
        Math.max(
          0,
          Number(producto.stock) || 0
        );


      const precio =
        Number(producto.precio) || 0;



      /* =====================================================
         BOTONES DE VARIANTES
         ===================================================== */

      let variantesHTML = "";


      if (tieneVariantes) {

        variantesHTML = `

          <div class="detail-tones">

            <div class="detail-tone-heading">

              <h3>
                Elige tu color
              </h3>

              <span
                id="nombreVarianteSeleccionada"
                class="selected-tone-name"
              >
                ${
                  varianteInicial
                    ? escaparHTML(
                        varianteInicial.nombre
                      )
                    : "Selecciona una opción"
                }
              </span>

            </div>


            <div
              class="tone-list"
              id="listaTonos"
              role="group"
              aria-label="Colores disponibles"
            >

              ${variantes.map(
                (variante, index) => {

                  const seleccionada =
                    varianteInicial &&
                    variante.nombre ===
                    varianteInicial.nombre;


                  return `

                    <button
                      type="button"
                      class="tone-button ${
                        seleccionada
                          ? "tone-selected"
                          : ""
                      }"
                      data-variante-index="${index}"
                      aria-pressed="${
                        seleccionada
                          ? "true"
                          : "false"
                      }"
                    >

                      ${escaparHTML(
                        variante.nombre
                      )}

                    </button>

                  `;

                }
              ).join("")}

            </div>


            <p
              id="mensajeVariante"
              class="variant-selection-help ${
                varianteInicial
                  ? "variant-selected-message"
                  : ""
              }"
            >

              ${
                varianteInicial
                  ? `${escaparHTML(
                      varianteInicial.nombre
                    )} seleccionado`
                  : `
                    Selecciona el color que quieres
                    antes de agregarlo al carrito.
                  `
              }

            </p>

          </div>

        `;

      }



      const textoBoton =
        stock > 0
          ? "Agregar al carrito"
          : "Producto agotado";



      contenedor.innerHTML = `

        <section class="detail-layout">


          <!-- ===============================================
               GALERÍA
               =============================================== -->

          <div class="detail-gallery">

            <div class="detail-image-wrapper">

              ${
                imagenPrincipal
                  ? `
                    <img
                      id="imagenProductoPrincipal"
                      src="${escaparHTML(
                        imagenPrincipal
                      )}"
                      alt="${nombre}${
                        varianteInicial
                          ? ` - ${escaparHTML(
                              varianteInicial.nombre
                            )}`
                          : ""
                      }"
                    >
                  `
                  : `
                    <div class="detail-image-placeholder">
                      BLUSHÉA
                    </div>
                  `
              }

            </div>


            ${
              tieneVariantes
                ? `
                  <p class="detail-image-note">
                    La imagen cambia según el color
                    seleccionado.
                  </p>
                `
                : ""
            }

          </div>



          <!-- ===============================================
               INFORMACIÓN
               =============================================== -->

          <div class="detail-info">

            <span class="detail-category">
              ${categoria}
            </span>


            <h1>
              ${nombre}
            </h1>


            <div class="detail-price">

              ${formatearPrecio(
                precio
              )}

            </div>


            <div
              id="estadoStockProducto"
              class="${
                stock > 0
                  ? "stock-ok"
                  : "stock-out"
              }"
            >

              ${
                stock > 0
                  ? `Disponible · ${stock} ${
                      stock === 1
                        ? "unidad"
                        : "unidades"
                    }`
                  : "Producto agotado"
              }

            </div>



            <!-- DESCRIPCIÓN -->

            <div class="detail-description">

              <h3>
                Descripción
              </h3>

              <p>
                ${descripcion}
              </p>

            </div>



            <!-- VARIANTES -->

            ${variantesHTML}



            <!-- CANTIDAD -->

            <div class="quantity-box">

              <span>
                Cantidad
              </span>


              <div class="quantity-control">

                <button
                  type="button"
                  id="menosCantidad"
                  aria-label="Disminuir cantidad"
                  ${
                    stock <= 0
                      ? "disabled"
                      : ""
                  }
                >
                  −
                </button>


                <strong id="cantidadProducto">
                  1
                </strong>


                <button
                  type="button"
                  id="masCantidad"
                  aria-label="Aumentar cantidad"
                  ${
                    stock <= 0
                      ? "disabled"
                      : ""
                  }
                >
                  +
                </button>

              </div>

            </div>



            <!-- =============================================
                 ENVÍO
                 ============================================= -->

            <div class="delivery-box">

              <h3>
                Calcula tu domicilio
              </h3>


              <p class="delivery-intro">

                Consulta el valor aproximado del
                envío antes de finalizar tu compra.

              </p>


              <input
                type="text"
                id="direccionCliente"
                placeholder="Dirección de entrega"
                autocomplete="street-address"
                maxlength="250"
              >


              <input
                type="text"
                id="barrioCliente"
                placeholder="Barrio"
                autocomplete="address-level3"
                maxlength="120"
              >


              <button
                type="button"
                id="calcularEnvioBtn"
              >
                Calcular envío
              </button>


              <div
                id="resultadoEnvio"
                class="delivery-result"
                aria-live="polite"
              ></div>

            </div>



            <!-- =============================================
                 AGREGAR
                 ============================================= -->

            <button
              type="button"
              id="botonComprarDetalle"
              class="buy-detail-button"
              ${
                stock <= 0
                  ? "disabled"
                  : ""
              }
            >

              ${textoBoton}

            </button>


            <div
              id="mensajeCarrito"
              class="detail-cart-message"
              aria-live="polite"
            ></div>


            <a
              href="/#productos"
              class="back-link"
            >
              Volver al catálogo
            </a>

          </div>

        </section>

      `;


      activarProducto(
        producto,
        variantes,
        varianteInicial
      );

    }



    /* =====================================================
       ACTIVAR PRODUCTO
       ===================================================== */

    function activarProducto(
      producto,
      variantes,
      varianteInicial
    ) {

      const menos =
        document.getElementById(
          "menosCantidad"
        );


      const mas =
        document.getElementById(
          "masCantidad"
        );


      const cantidadTexto =
        document.getElementById(
          "cantidadProducto"
        );


      const botonComprar =
        document.getElementById(
          "botonComprarDetalle"
        );


      const mensajeCarrito =
        document.getElementById(
          "mensajeCarrito"
        );


      const imagenPrincipal =
        document.getElementById(
          "imagenProductoPrincipal"
        );


      const nombreVariante =
        document.getElementById(
          "nombreVarianteSeleccionada"
        );


      const mensajeVariante =
        document.getElementById(
          "mensajeVariante"
        );


      const botonesTono =
        document.querySelectorAll(
          ".tone-button"
        );


      const calcularEnvioBtn =
        document.getElementById(
          "calcularEnvioBtn"
        );


      const resultadoEnvio =
        document.getElementById(
          "resultadoEnvio"
        );


      const direccionCliente =
        document.getElementById(
          "direccionCliente"
        );


      const barrioCliente =
        document.getElementById(
          "barrioCliente"
        );


      const precio =
        Number(
          producto.precio
        ) || 0;


      const stock =
        Math.max(
          0,
          Number(
            producto.stock
          ) || 0
        );


      let cantidad = 1;


      /*
       * CAMBIO CLAVE:
       *
       * Si la clienta eligió Negro en catálogo,
       * varianteSeleccionada empieza siendo Negro.
       */

      let varianteSeleccionada =
        varianteInicial || null;



      /* =====================================================
         SELECCIONAR VARIANTE
         ===================================================== */

      botonesTono.forEach(
        boton => {

          boton.addEventListener(
            "click",
            () => {

              const indice =
                Number(
                  boton.dataset.varianteIndex
                );


              const variante =
                variantes[indice];


              if (!variante) {
                return;
              }


              varianteSeleccionada =
                variante;


              /* -------------------------------------------
                 QUITAR SELECCIÓN ANTERIOR
                 ------------------------------------------- */

              botonesTono.forEach(
                botonActual => {

                  botonActual.classList.remove(
                    "tone-selected"
                  );


                  botonActual.setAttribute(
                    "aria-pressed",
                    "false"
                  );

                }
              );


              /* -------------------------------------------
                 SELECCIONAR ACTUAL
                 ------------------------------------------- */

              boton.classList.add(
                "tone-selected"
              );


              boton.setAttribute(
                "aria-pressed",
                "true"
              );


              /* -------------------------------------------
                 MOSTRAR NOMBRE
                 ------------------------------------------- */

              if (nombreVariante) {

                nombreVariante.textContent =
                  variante.nombre;

              }


              /* -------------------------------------------
                 CAMBIAR IMAGEN
                 ------------------------------------------- */

              if (
                imagenPrincipal &&
                variante.imagen
              ) {

                imagenPrincipal.classList.add(
                  "is-changing"
                );


                const nuevaImagen =
                  new Image();


                nuevaImagen.onload =
                  () => {

                    imagenPrincipal.src =
                      variante.imagen;


                    imagenPrincipal.alt =
                      `${producto.nombre} - ${variante.nombre}`;


                    requestAnimationFrame(
                      () => {

                        imagenPrincipal.classList.remove(
                          "is-changing"
                        );

                      }
                    );

                  };


                nuevaImagen.onerror =
                  () => {

                    imagenPrincipal.classList.remove(
                      "is-changing"
                    );

                  };


                nuevaImagen.src =
                  variante.imagen;

              }


              /* -------------------------------------------
                 MENSAJE
                 ------------------------------------------- */

              if (mensajeVariante) {

                mensajeVariante.textContent =
                  `${variante.nombre} seleccionado`;


                mensajeVariante.classList.add(
                  "variant-selected-message"
                );

              }


              if (mensajeCarrito) {

                mensajeCarrito.innerHTML =
                  "";

              }


              /* -------------------------------------------
                 ACTUALIZAR URL SIN RECARGAR

                 Esto permite que incluso copiando el
                 enlace quede guardado el color.
                 ------------------------------------------- */

              const nuevaURL =
                new URL(
                  window.location.href
                );


              nuevaURL.searchParams.set(
                "variante",
                variante.nombre
              );


              window.history.replaceState(
                {},
                "",
                nuevaURL
              );

            }
          );

        }
      );



      /* =====================================================
         RESTAR CANTIDAD
         ===================================================== */

      menos?.addEventListener(
        "click",
        () => {

          if (cantidad > 1) {

            cantidad--;

            cantidadTexto.textContent =
              cantidad;

          }

        }
      );



      /* =====================================================
         SUMAR CANTIDAD
         ===================================================== */

      mas?.addEventListener(
        "click",
        () => {

          if (cantidad >= stock) {

            mensajeCarrito.innerHTML = `

              <p class="delivery-error">

                Solo tenemos ${stock}
                ${
                  stock === 1
                    ? "unidad disponible"
                    : "unidades disponibles"
                }.

              </p>

            `;

            return;

          }


          cantidad++;

          cantidadTexto.textContent =
            cantidad;


          mensajeCarrito.innerHTML =
            "";

        }
      );



      /* =====================================================
         CALCULAR ENVÍO
         ===================================================== */

      calcularEnvioBtn?.addEventListener(
        "click",
        async () => {

          const direccion =
            direccionCliente
              ?.value
              .trim() ||
            "";


          const barrio =
            barrioCliente
              ?.value
              .trim() ||
            "";


          if (!direccion || !barrio) {

            resultadoEnvio.innerHTML = `

              <p class="delivery-error">

                Escribe la dirección y el barrio
                para calcular el envío.

              </p>

            `;

            return;

          }


          calcularEnvioBtn.disabled =
            true;


          calcularEnvioBtn.textContent =
            "Calculando...";


          resultadoEnvio.innerHTML = `

            <p>
              Calculando domicilio...
            </p>

          `;


          try {

            const respuesta =
              await fetch(
                "/api/calcular-envio",
                {

                  method: "POST",

                  headers: {

                    "Content-Type":
                      "application/json"

                  },

                  body:
                    JSON.stringify({

                      direccion,

                      barrio,

                      ciudad:
                        "Medellín"

                    })

                }
              );


            let resultado;


            try {

              resultado =
                await respuesta.json();

            } catch {

              resultado = {};

            }


            if (!respuesta.ok) {

              resultadoEnvio.innerHTML = `

                <p class="delivery-error">

                  ${escaparHTML(
                    resultado.mensaje ||
                    "No pudimos calcular el envío."
                  )}

                </p>

              `;

              return;

            }


            const valorEnvio =
              Number(
                resultado.valorEnvio
              ) || 0;


            const subtotal =
              precio *
              cantidad;


            const total =
              subtotal +
              valorEnvio;


            resultadoEnvio.innerHTML = `

              <div class="delivery-summary">

                <p>

                  <strong>
                    Envío:
                  </strong>

                  ${formatearPrecio(
                    valorEnvio
                  )}

                </p>


                <p>

                  <strong>
                    Producto:
                  </strong>

                  ${formatearPrecio(
                    subtotal
                  )}

                </p>


                <p>

                  <strong>
                    Total estimado:
                  </strong>

                  ${formatearPrecio(
                    total
                  )}

                </p>

              </div>

            `;


          } catch (error) {

            console.error(
              "Error calculando envío:",
              error
            );


            resultadoEnvio.innerHTML = `

              <p class="delivery-error">

                No pudimos conectar con el servidor.
                Intenta nuevamente.

              </p>

            `;

          } finally {

            calcularEnvioBtn.disabled =
              false;


            calcularEnvioBtn.textContent =
              "Calcular envío";

          }

        }
      );



      /* =====================================================
         AGREGAR AL CARRITO
         ===================================================== */

      botonComprar?.addEventListener(
        "click",
        () => {


          /* -------------------------------------------------
             AGOTADO
             ------------------------------------------------- */

          if (stock <= 0) {

            mensajeCarrito.innerHTML = `

              <p class="delivery-error">
                Este producto está agotado.
              </p>

            `;

            return;

          }


          /* -------------------------------------------------
             VARIANTE OBLIGATORIA
             ------------------------------------------------- */

          if (
            variantes.length > 0 &&
            !varianteSeleccionada
          ) {

            mensajeCarrito.innerHTML = `

              <p class="delivery-error">

                Elige primero el color o tono
                que quieres.

              </p>

            `;


            document
              .getElementById(
                "listaTonos"
              )
              ?.scrollIntoView({

                behavior:
                  "smooth",

                block:
                  "center"

              });


            return;

          }


          /* -------------------------------------------------
             TONO E IMAGEN EXACTOS
             ------------------------------------------------- */

          const tono =
            varianteSeleccionada
              ? varianteSeleccionada.nombre
              : "";


          const imagen =
            varianteSeleccionada?.imagen ||
            producto.imagen ||
            "";


          const carrito =
            obtenerCarrito();



          /* -------------------------------------------------
             BUSCAR MISMO PRODUCTO + MISMO COLOR

             Negro y Rosado se consideran dos líneas
             diferentes dentro del carrito.
             ------------------------------------------------- */

          const existente =
            carrito.find(
              item =>

                String(item.id) ===
                String(producto.id)

                &&

                String(item.tono || "") ===
                String(tono)

            );


          if (existente) {

            const nuevaCantidad =
              Number(
                existente.cantidad || 0
              ) +
              cantidad;


            if (nuevaCantidad > stock) {

              mensajeCarrito.innerHTML = `

                <p class="delivery-error">

                  Ya tienes unidades de este producto
                  en el carrito y no podemos superar
                  el stock disponible.

                </p>

              `;

              return;

            }


            existente.cantidad =
              nuevaCantidad;


            existente.imagen =
              imagen;

          } else {

            carrito.push({

              id:
                producto.id,

              nombre:
                producto.nombre,

              precio:
                precio,

              imagen:
                imagen,

              cantidad:
                cantidad,

              tono:
                tono

            });

          }


          guardarCarrito(
            carrito
          );


          window.location.href =
            "/carrito.html";

        }
      );

    }



    /* =====================================================
       INICIAR
       ===================================================== */

    cargarDetalleProducto();

  </script>
