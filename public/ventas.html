<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de ventas | Blushéa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>BLUSHÉA</h1>
    <span>Historial de ventas</span>
  </div>

  <nav class="nav">
    <a href="/pedidos.html">Pedidos</a>
    <a href="/admin.html">Productos</a>
  </nav>
</header>

<main class="orders-page">
  <h2>Productos vendidos</h2>
  <div id="listaVentas"></div>
</main>

<script>
const ADMIN_KEY_STORAGE = "blusheaAdminApiKey";
function adminKey() {
  let clave = sessionStorage.getItem(ADMIN_KEY_STORAGE) || "";
  if (!clave) {
    clave = window.prompt("Clave administrativa:") || "";
    if (clave) sessionStorage.setItem(ADMIN_KEY_STORAGE, clave);
  }
  return clave;
}
function adminHeaders() {
  const clave = adminKey();
  return clave ? { "x-admin-key": clave } : {};
}

function escaparHTML(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function cargarVentas() {
  const contenedor = document.getElementById("listaVentas");

  const respuesta = await fetch("/api/ventas", { headers: adminHeaders(), cache: "no-store" });
  if (!respuesta.ok) {
    if (respuesta.status === 401) sessionStorage.removeItem(ADMIN_KEY_STORAGE);
    contenedor.innerHTML = '<div class="empty-state"><h3>No fue posible acceder al historial de ventas.</h3></div>';
    return;
  }
  const ventas = await respuesta.json();

  contenedor.innerHTML = "";

  if (!ventas.length) {
    contenedor.innerHTML = `
      <div class="empty-state">
        <h3>No hay ventas registradas todavía</h3>
      </div>
    `;
    return;
  }

  ventas.reverse().forEach((venta) => {
    contenedor.innerHTML += `
      <article class="order-card">
        <div class="order-header">
          <h3>Venta #${venta.id}</h3>
          <span>Entregado</span>
        </div>

        <p><strong>Cliente:</strong> ${escaparHTML(venta.cliente.nombre)}</p>
        <p><strong>Teléfono:</strong> ${escaparHTML(venta.cliente.telefono)}</p>
        <p><strong>Dirección:</strong> ${escaparHTML(venta.cliente.direccion)}, ${escaparHTML(venta.cliente.barrio)}</p>
        <p><strong>Fecha venta:</strong> ${escaparHTML(venta.fechaEntregado)}</p>

        ${venta.productos.map(p => `
          <div class="order-product">
            <img src="${escaparHTML(p.imagen)}">
            <div>
              <strong>${escaparHTML(p.nombre)}</strong>
              ${p.tono ? `<p>Tono: ${escaparHTML(p.tono)}</p>` : ""}
              <p>Cantidad: ${p.cantidad}</p>
            </div>
          </div>
        `).join("")}

        <div class="order-total">
          <p><strong>Total:</strong> $${venta.total.toLocaleString("es-CO")} COP</p>
        </div>
      </article>
    `;
  });
}

cargarVentas();
</script>

</body>
</html>
